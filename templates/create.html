{{define "content"}}
<div class="card">
    <form action="/save" method="POST">
        <input type="text" name="title" placeholder="Snippet Title (e.g., Database Migrations)" required>
        <div class="form-row">
            <select name="language">
                <option value="Plain Text">Plain Text</option>
                <option value="Go">Go</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="HTML/CSS">HTML/CSS</option>
                <option value="SQL">SQL</option>
                <option value="JSON">JSON</option>
            </select>
            <select name="ttl">
                <option value="10m">Expires in 10 Minutes</option>
                <option value="1h">Expires in 1 Hour</option>
                <option value="24h" selected>Expires in 24 Hours</option>
                <option value="168h">Expires in 7 Days</option>
            </select>
        </div>
        <textarea name="content" placeholder="Paste your text or code here..." required></textarea>
        <button type="submit" class="btn">Create Shareable Link</button>
    </form>
</div>
{{end}}
